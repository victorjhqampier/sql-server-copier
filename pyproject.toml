[project]
name = "dp-migrate-sqlserver"
version = "1.0.0"
description = "Migrador SQL Server -> SQL Server en Python puro con uv. Fase DDL (estructura) y fase DML (datos por lotes)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymssql>=2.3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["src"]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F63", "F7", "F82"]

[tool.ruff.format]
line-ending = "lf"
